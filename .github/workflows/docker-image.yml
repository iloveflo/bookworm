name: Build & Push Docker Image

on:
  push:
    branches: [ "main" ]

    paths-ignore:
      - 'README.md'
      - '**/*.md'     
      - '**/*.txt'
      - '**/*.gitignore'  

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Bắt buộc: Cấp quyền push image vào GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR bắt buộc tên image viết thường 100%, bước này đảm bảo không bị lỗi cú pháp
      - name: Set lowercase repository owner
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bookstore" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Tự sinh, không cần tạo secret thủ công

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}